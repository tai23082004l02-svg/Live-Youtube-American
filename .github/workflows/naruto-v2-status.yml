name: Naruto v2 voice diagnostic receipt
on:
  push:
    branches: [main]
    paths: [.github/workflows/naruto-v2-status.yml]
permissions:
  actions: read
  contents: write
jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          import os,json,urllib.request,pathlib,subprocess,zipfile,io,re
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return response.read()
          runs=json.loads(get('/actions/workflows/naruto-v2-voice.yml/runs?per_page=1'))['workflow_runs']
          report=[]
          for run in runs:
              jobs=json.loads(get('/actions/runs/'+str(run['id'])+'/jobs'))['jobs']
              item={'status':run['status'],'conclusion':run['conclusion'],'url':run['html_url'],'steps':[{k:s.get(k) for k in ['name','status','conclusion']} for j in jobs for s in j['steps']]}
              if run['status']=='completed':
                  try:
                      logs=zipfile.ZipFile(io.BytesIO(get('/actions/runs/'+str(run['id'])+'/logs')))
                      safe=[]
                      patterns=[r'ElevenLabs HTTP \d+',r'No supported voice found',r'Missing ELEVENLABS_API_KEY',r'Unexpected audio response',r'No response; no retry',r'fatal: [a-zA-Z ]+',r'error: [a-zA-Z ]+',r'HTTP Error \d+: [a-zA-Z ]+',r'AssertionError',r'PermissionError',r'FileNotFoundError']
                      for name in logs.namelist():
                          text=logs.read(name).decode(errors='replace')
                          for line in text.splitlines():
                              message=re.sub(r'^\d{4}-\d\d-\d\dT[^ ]+ ', '',line).strip()
                              if any(message.startswith(prefix) for prefix in ['No supported voice found','Missing ELEVENLABS_API_KEY','ElevenLabs HTTP','Unexpected audio response','No response; no retry','fatal:','error:','Traceback','FileNotFoundError:','NameError:','KeyError:','AssertionError','urllib.error.HTTPError:','SyntaxError:','IndentationError:']):safe.append(message[:300])
                      item['diagnostics']=sorted(set(safe))
                  except Exception as e:item['logReadError']=type(e).__name__
              report.append(item)
          req=urllib.request.Request('https://api.elevenlabs.io/v1/voices',headers={'xi-api-key':os.environ.get('ELEVENLABS_API_KEY','')})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:catalog=json.load(response)['voices']
              report.append({'catalogNames':[v.get('name') for v in catalog]})
          except Exception as e:report.append({'catalogError':type(e).__name__})
          out=pathlib.Path('docs/naruto-v2-voice-status.json');out.write_text(json.dumps(report,indent=2)+'\n')
          def git(*args):subprocess.run(['git',*args],check=True)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add',str(out))
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              git('commit','-m','Record Naruto voice workflow status without credentials');git('pull','--rebase','origin','main');git('push','origin','HEAD:main')
